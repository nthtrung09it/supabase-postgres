# Build & push the Supabase Postgres 18 image on an EPHEMERAL DigitalOcean droplet.
#
# Fork-only workflow (nthtrung09it/supabase-postgres), same pattern as
# open-design's build-open-design.yml: start-runner creates a droplet from the
# pre-baked builder snapshot, it registers as an --ephemeral runner, builds
# Dockerfile-18, pushes to Harbor, and stop-runner destroys it.
#
# Why a LONG build: nothing built against PG 18.6 exists in any binary cache,
# so the single `nix profile add .#psql_18_slim/bin` layer in Dockerfile-18
# compiles Postgres plus every extension from source — including the Rust/pgrx
# ones (pg_graphql, pg_jsonschema, wrappers). That can run past the 2h
# ci-ephemeral reaper threshold, so the droplet is tagged ci-ephemeral-long,
# which hello-k3s-ansible's reap-ci-droplets.yml sweeps with a longer limit.
#
# Requires in THIS repo:
#   secret  DO_API_TOKEN     DigitalOcean PAT (write)
#   secret  GITOPS_PAT       classic repo-scoped PAT, admin on this repo
#                            (GITHUB_TOKEN CANNOT register self-hosted runners)
#   secret  HARBOR_USERNAME / HARBOR_PASSWORD
#   var     DO_BUILDER_SNAPSHOT_ID   (230898546)
# and a k3s-runners scale set for this repo (hello-k3s-ansible
# 41-gitlab-runners/apps/arc/runner-set/envs/central/values.yaml).
name: Build & Push Supabase Postgres 18 Image

on:
  workflow_dispatch:
  push:
    branches:
      - pg-18-6

concurrency:
  group: build-supabase-postgres-18
  cancel-in-progress: false

jobs:
  # ── 1. Create the ephemeral DO droplet + register an ephemeral runner ───────
  start-runner:
    # Same gate as the build, so an ordinary push never creates a paid droplet.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ci build]')
    runs-on: k3s-runners
    timeout-minutes: 15
    outputs:
      label: ${{ steps.start.outputs.label }}
      droplet_id: ${{ steps.start.outputs.droplet_id }}
    steps:
      - name: Set up doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_API_TOKEN }}

      - name: Create ephemeral DO runner
        id: start
        env:
          GH_PAT: ${{ secrets.GITOPS_PAT }}
          REPO: ${{ github.repository }}
          SNAPSHOT: ${{ vars.DO_BUILDER_SNAPSHOT_ID }}
        run: |
          set -euo pipefail
          command -v jq >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq jq; }

          LABEL="do-runner-${GITHUB_RUN_ID}"
          NAME="supabase-postgres-18-builder-${GITHUB_RUN_ID}"

          REG_TOKEN=$(curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_PAT}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/runners/registration-token" | jq -r .token)
          [ -n "$REG_TOKEN" ] && [ "$REG_TOKEN" != "null" ] \
            || { echo "::error::No registration token — is GITOPS_PAT a classic repo-scoped PAT with admin on ${REPO}?"; exit 1; }

          cat > /tmp/cloud-init.sh <<EOF
          #!/bin/bash
          set -eux
          export RUNNER_ALLOW_RUNASROOT=1
          cd /actions-runner
          ./config.sh --url "https://github.com/${REPO}" --token "${REG_TOKEN}" \
            --labels "${LABEL}" --name "${NAME}" --unattended --ephemeral --replace
          ./svc.sh install root
          ./svc.sh start
          EOF

          # c-8 (8 dedicated vCPU / 16 GB / 100 GB disk), not open-design's
          # s-4vcpu-8gb: this is a long CPU-bound compile (C + Rust/pgrx), where
          # dedicated vCPUs avoid shared-CPU throttling and 16 GB keeps the Rust
          # link steps from OOMing. 100 GB clears the snapshot's 80 GB min disk.
          # Tagged ci-ephemeral-long (NOT ci-ephemeral): see header.
          DROPLET_ID=$(doctl compute droplet create "$NAME" \
            --region sgp1 --size c-8 \
            --image "$SNAPSHOT" \
            --ssh-keys 43399145 \
            --tag-name ci-ephemeral-long \
            --user-data-file /tmp/cloud-init.sh \
            --wait --output json | jq -r '.[0].id')
          [ -n "$DROPLET_ID" ] && [ "$DROPLET_ID" != "null" ] || { echo "::error::droplet create failed"; exit 1; }
          echo "label=${LABEL}"          >> "$GITHUB_OUTPUT"
          echo "droplet_id=${DROPLET_ID}" >> "$GITHUB_OUTPUT"
          echo "Created droplet ${DROPLET_ID}; waiting for runner '${LABEL}' online…"

          # GITOPS_PAT shares its 5000/h REST quota with everything else on the
          # same GitHub account (kelos TaskSpawners poll PRs every minute and
          # can drain it). If the runners API is failing we can't SEE the
          # runner, but that doesn't mean it's down: after the droplet has had
          # ~2 min to boot, proceed and let the build job queue for its label
          # rather than tearing down a healthy droplet.
          API_FAILS=0
          for i in $(seq 1 40); do
            if RESP=$(curl -fsS \
                -H "Authorization: Bearer ${GH_PAT}" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${REPO}/actions/runners?per_page=100" 2>&1); then
              API_FAILS=0
              STATUS=$(echo "$RESP" | jq -r --arg L "$LABEL" '.runners[] | select(any(.labels[]; .name==$L)) | .status' | head -1)
              if [ "$STATUS" = "online" ]; then echo "Runner online after ~$((i*10))s"; exit 0; fi
              echo "  waiting… (${i}/40) status=${STATUS:-none}"
            else
              API_FAILS=$((API_FAILS + 1))
              echo "::warning::runners API call failed (${API_FAILS}x): ${RESP}"
              if [ "$API_FAILS" -ge 6 ] && [ "$i" -ge 12 ]; then
                echo "::warning::cannot verify runner '${LABEL}' (GitHub API unavailable, likely rate limit); proceeding — the build job will queue until it comes online"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "::error::runner did not come online within ~400s"; exit 1

  # ── 2. The heavy build — runs ON the DO droplet ─────────────────────────────
  build:
    needs: start-runner
    runs-on: ${{ needs.start-runner.outputs.label }}
    # Must stay under the ci-ephemeral-long reaper threshold (5h) in
    # hello-k3s-ansible's reap-ci-droplets.yml.
    timeout-minutes: 240
    env:
      IMAGE_BASE: harbor.trungnguyen.dev/elearning/supabase-postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full commit history (file contents fetched on demand) so the tag
          # step can find the upstream supabase/postgres commit in HEAD.
          fetch-depth: 0
          filter: blob:none

      - name: Compute image tag
        id: tag
        run: |
          set -euo pipefail
          # Tag scheme: .github/scripts/image-tag.sh — <release>-rc<N>-up<upstream>-<commit>.
          # The release comes from ansible/vars.yml (postgres18 without its -rcN); N, the
          # next free rc over both image repos, is taken at PUSH time, so a failed build
          # uses no number.
          PG_RELEASE=$(bash .github/scripts/image-tag.sh release)

          # Upstream supabase/postgres commit this build is based on: the newest
          # commit in HEAD's history that some supabase/postgres branch contains
          # (everything newer is ours). Commit graph only (--filter=tree:0), no
          # tags, over git: no GitHub REST quota needed.
          git remote add upstream https://github.com/supabase/postgres.git 2>/dev/null || true
          git fetch --quiet --no-tags --filter=tree:0 upstream '+refs/heads/*:refs/remotes/upstream/*'
          git rev-list HEAD --not --remotes=upstream > "$RUNNER_TEMP/ours.txt"
          # sed -n 1p (not head -1): reads all input, so no SIGPIPE under pipefail
          UPSTREAM=$(git rev-list --date-order HEAD | grep -v -x -F -f "$RUNNER_TEMP/ours.txt" | sed -n 1p)
          [ -n "$UPSTREAM" ] || { echo "::error::no supabase/postgres commit found in HEAD's history"; exit 1; }

          # -up<upstream supabase/postgres>-<this repo>: which upstream it is built on,
          # and which commit of this fork.
          SHA_SHORT=$(git rev-parse --short=8 HEAD)
          UP_SHORT=$(git rev-parse --short=8 "$UPSTREAM")
          {
            echo "release=${PG_RELEASE}"
            echo "suffix=-up${UP_SHORT}-${SHA_SHORT}"
            echo "local=${IMAGE_BASE}:build-${GITHUB_RUN_ID}"
            echo "image_latest=${IMAGE_BASE}:18-latest"
            echo "upstream=${UPSTREAM}"
          } >> "$GITHUB_OUTPUT"
          echo "Upstream supabase/postgres: $(git log -1 --format='%h %cd %s' --date=short "$UPSTREAM")"
          echo "  on: $(git branch -r --contains "$UPSTREAM" | grep upstream/ | tr -d ' ' | tr '\n' ' ')"
          echo "Our commits on top: $(grep -c . "$RUNNER_TEMP/ours.txt")"
          echo "Tag: ${PG_RELEASE}-rc<next free at push>-up${UP_SHORT}-${SHA_SHORT}"

      # Safety net for the parallel Nix build below (4 derivations x 4 threads):
      # several Rust/pgrx builds linking at once can exceed the droplet's 16 GB.
      # With swap they slow down instead of being OOM-killed an hour in. The
      # snapshot ships no swap; the 100 GB disk has ~80 GB free.
      - name: Add swap
        run: |
          set -euo pipefail
          if ! swapon --show | grep -q .; then
            fallocate -l 16G /swapfile
            chmod 600 /swapfile
            mkswap /swapfile >/dev/null
            swapon /swapfile
          fi
          swapon --show
          free -h

      # Build ONCE into the local docker daemon (default `docker` buildx driver,
      # so no tarball export), then push separately with retries. Unlike
      # build-claude-agent-headless.yml we do NOT loop `buildx build --push`:
      # a genuine compile failure here costs 1-2h per attempt and would burn
      # the whole job timeout retrying.
      - name: Build image
        env:
          IMAGE: ${{ steps.tag.outputs.local }}
          IMAGE_LATEST: ${{ steps.tag.outputs.image_latest }}
          UPSTREAM: ${{ steps.tag.outputs.upstream }}
        run: |
          set -euo pipefail
          # Dockerfile-18's nix-builder stage does `COPY . .` and builds the
          # flake from it, so the build context must be the repo root.
          # NO registry cache: Harbor's Cloudflare R2 backend rejects the large
          # cache blob (see build-open-design.yml), and the droplet is discarded
          # each run, so a local cache is worthless anyway.
          # SUPABASE_NIX_CACHE empty = build WITHOUT Supabase's S3 binary cache.
          # From sgp1 that us-east-1 bucket measured 3-17 KB/s (vs 7 MB/s to
          # GitHub), so every Supabase-only path trickled and the first run
          # sat on one 3.9 MB download for 15+ min. nixpkgs deps still come
          # from cache.nixos.org (Fastly, and preferred anyway: priority 40 vs
          # the bucket's default 50); sources are fetched from origin and the
          # few Supabase-only derivations are built on the droplet.
          # NIX_MAX_JOBS / NIX_CORES: sized for the c-8 droplet (8 vCPU / 16 GB)
          # created by start-runner — up to 4 derivations at a time, each may
          # use all 8 threads. Nix's default max-jobs=1 left the CPU mostly
          # idle (first build: 15-min load ~2.6 on 8 vCPUs, ~67 min). With
          # cores=4, the long tail was still half idle: wrappers 0.6.x compiles
          # the bundled DuckDB C++ engine (libduckdb-sys) as ONE derivation,
          # capped at 4 threads while few other derivations were left (CPU 48%
          # idle). cores=8 lets such single big builds use the whole droplet;
          # when 4 run at once it is ~4x oversubscribed, which only costs some
          # context switching — the 16G swap above covers the higher peak RAM.
          # Re-tune both if the droplet size changes.
          docker buildx build \
            --platform linux/amd64 \
            --file Dockerfile-18 \
            --build-arg SUPABASE_NIX_CACHE= \
            --build-arg NIX_MAX_JOBS=4 \
            --build-arg NIX_CORES=8 \
            --label org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            --label dev.trungnguyen.supabase-postgres.upstream-revision="${UPSTREAM}" \
            --tag "$IMAGE" --tag "$IMAGE_LATEST" \
            --load \
            --progress plain \
            .

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: harbor.trungnguyen.dev
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # Retry the push: Harbor's registry can OOM/502 mid-push on largish
      # layers. `docker push` skips layers the registry already has, so each
      # retry only re-sends what didn't land.
      - name: Push to Harbor (retry on 502/OOM)
        id: push
        env:
          LOCAL: ${{ steps.tag.outputs.local }}
          RELEASE: ${{ steps.tag.outputs.release }}
          SUFFIX: ${{ steps.tag.outputs.suffix }}
          IMAGE_LATEST: ${{ steps.tag.outputs.image_latest }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -eu
          # The next free rc of this release over both image repos, taken now (after the
          # build), never an existing tag: nothing is ever overwritten.
          N=$(bash .github/scripts/image-tag.sh next-rc "$RELEASE")
          while :; do
            TAG="${RELEASE}-rc${N}${SUFFIX}"
            rc=0; bash .github/scripts/image-tag.sh exists supabase-postgres "$TAG" || rc=$?
            [ "$rc" = 2 ] && { echo "::error::cannot read Harbor tags"; exit 1; }
            [ "$rc" = 1 ] && break
            N=$((N + 1))
          done
          IMAGE="${IMAGE_BASE}:${TAG}"
          docker tag "$LOCAL" "$IMAGE"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Tag: ${TAG}"
          # Upload progress (same monitor as open-design's
          # build-open-design.yml): outside a TTY `docker push` prints no byte
          # counts, so a slow Harbor upload looks identical to a hang. Only a
          # process in the SAME step can write into this log, hence the inline
          # background monitor: bytes sent on the default-route interface
          # every 30s, e.g. "[upload] 67 MB sent since push start, 88 KB/s".
          IF=$(ip route show default | awk '{print $5; exit}')
          sent() { cat "/sys/class/net/$IF/statistics/tx_bytes"; }
          echo "Image size: $(( $(docker image inspect --format '{{.Size}}' "$IMAGE") / 1048576 )) MB uncompressed (the compressed upload is smaller)"
          (
            start=$(sent); p=$start
            while sleep 30; do
              b=$(sent); d=$((b - p)); p=$b
              if [ "$d" -gt 1048576 ]; then
                echo "[upload] $(( (b - start) / 1048576 )) MB sent since push start, $((d / 30 / 1024)) KB/s"
              fi
            done
          ) &
          MONITOR=$!
          trap 'kill "$MONITOR" 2>/dev/null || true' EXIT

          for ref in "$IMAGE" "$IMAGE_LATEST"; do
            pushed=false
            for attempt in 1 2 3 4 5; do
              if docker push "$ref"; then
                echo "pushed $ref on attempt ${attempt}"; pushed=true; break
              fi
              echo "::warning::push of $ref attempt ${attempt} failed (harbor 502 / registry OOM?); retrying in $((attempt * 30))s…"
              sleep $((attempt * 30))
            done
            $pushed || { echo "::error::push of $ref failed after 5 attempts"; exit 1; }
          done

      - name: Summary
        env:
          UPSTREAM: ${{ steps.tag.outputs.upstream }}
        run: |
          {
            echo "## Pushed image"
            echo "- \`${{ steps.push.outputs.image }}\`"
            echo "- \`${{ steps.tag.outputs.image_latest }}\`"
            echo ""
            echo "Upstream: [supabase/postgres@${UPSTREAM:0:8}](https://github.com/supabase/postgres/commit/${UPSTREAM}) + this repo @ \`${GITHUB_SHA:0:8}\`"
            echo ""
            echo "Next: bump \`cnpg/base-image\` to this tag and commit with \`[ci cnpg]\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 3. Destroy the droplet — always, whenever one was created ───────────────
  stop-runner:
    needs: [start-runner, build]
    runs-on: k3s-runners
    # Keyed on droplet_id, NOT on start-runner success: if start-runner created
    # the droplet and then failed (e.g. the online-poll timed out), this still
    # deletes it.
    if: ${{ always() && needs.start-runner.outputs.droplet_id != '' }}
    timeout-minutes: 10
    steps:
      - name: Set up doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_API_TOKEN }}

      - name: Destroy droplet + deregister runner
        env:
          GH_PAT: ${{ secrets.GITOPS_PAT }}
          REPO: ${{ github.repository }}
          LABEL: ${{ needs.start-runner.outputs.label }}
          DROPLET_ID: ${{ needs.start-runner.outputs.droplet_id }}
        run: |
          set -uo pipefail
          if [ -n "${DROPLET_ID:-}" ]; then
            doctl compute droplet delete "$DROPLET_ID" --force || true
            echo "Deleted droplet ${DROPLET_ID}"
          fi
          RID=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_PAT}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/runners?per_page=100" \
            | jq -r --arg L "$LABEL" '.runners[] | select(any(.labels[]; .name==$L)) | .id' | head -1 || true)
          if [ -n "${RID:-}" ] && [ "$RID" != "null" ]; then
            curl -fsSL -X DELETE \
              -H "Authorization: Bearer ${GH_PAT}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/actions/runners/${RID}" || true
            echo "Deregistered lingering runner ${RID}"
          fi
